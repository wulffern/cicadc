<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cicadc – ADC Visualiser</title>
<style>
:root {
  --bg:     #0b0f1a;
  --edge:   #2b3a63;
  --grid:   #1d2742;
  --curve:  #3361e6;
  --quant:  #b6e3b6;
  --digi:   #cdd6e6;
  --error:  #ff4444;
  --sample: #ffd400;
  --text:   #e6f0ff;
  --bar:    #3b82f6;
  --barnow: #39ff14;
  --muted:  #6080a0;
  --ctrl:   #0f1526;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Courier New', monospace; font-size: 12px;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 10px 20px; gap: 8px;
}
h1 { color: var(--curve); font-size: 16px; letter-spacing: 4px; padding: 4px 0; }
#chain { display: flex; align-items: center; gap: 4px; width: 100%; max-width: 1200px; }
.cb {
  flex: 1; text-align: center; padding: 3px 0; font-size: 10px; letter-spacing: 1px;
  background: var(--grid); border: 1px solid var(--edge); color: var(--muted);
  transition: all 0.2s;
}
.cb.on { border-color: var(--curve); color: var(--curve); background: #0d1830; }
.ca { color: var(--edge); font-size: 10px; }
canvas {
  display: block;
  background: var(--bg); border: 1px solid var(--edge);
  max-width: 100%; /* fallback before JS runs */
}
#ctrl {
  width: 100%; max-width: 1200px;
  background: var(--ctrl); border: 1px solid var(--edge);
  padding: 10px 14px;
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px 24px;
}
.cg { display: flex; flex-direction: column; gap: 6px; }
.cgt {
  color: var(--curve); font-size: 9px; letter-spacing: 2px;
  border-bottom: 1px solid var(--grid); padding-bottom: 3px; margin-bottom: 1px;
}
.cr { display: flex; align-items: center; gap: 6px; }
.cr label { color: var(--muted); min-width: 88px; flex-shrink: 0; font-size: 11px; }
.cr input[type=range] { flex: 1; accent-color: var(--curve); cursor: pointer; }
.cr .v { color: var(--text); min-width: 52px; text-align: right; font-size: 11px; }
.modebtn {
  background: var(--grid); border: 1px solid var(--edge); color: var(--text);
  padding: 3px 6px; cursor: pointer; font-family: inherit; font-size: 11px;
  flex: 1; text-align: center;
}
.modebtn.on { background: var(--curve); color: #fff; border-color: var(--curve); }
.moderow { display: flex; gap: 5px; }
#playbtn {
  width: 100%; padding: 5px; cursor: pointer; font-family: inherit; font-size: 12px;
  background: var(--grid); border: 1px solid var(--edge); color: var(--text);
  margin-top: 2px;
}
#playbtn.paused { background: #0f2010; border-color: var(--barnow); color: var(--barnow); }
.ditrow { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
.ditrow input { accent-color: var(--curve); cursor: pointer; }
#legend {
  width: 100%; max-width: 1200px;
  display: flex; gap: 16px; flex-wrap: wrap;
  color: var(--muted); font-size: 10px; padding: 4px 2px;
}
.leg { display: flex; align-items: center; gap: 5px; }
.lsw { width: 20px; height: 3px; border-radius: 2px; }
.ldot { width: 8px; height: 8px; border-radius: 50%; }
@media (max-width: 700px) {
  body  { padding: 4px 4px 20px; gap: 4px; }
  #ctrl { grid-template-columns: 1fr 1fr; }
  .cb   { font-size: 8px; padding: 2px 1px; letter-spacing: 0; }
  .ca   { font-size: 8px; }
  .cr label { min-width: 70px; }
}
</style>
</head>
<body>

<h1>cicadc</h1>

<div id="chain">
  <div class="cb on">ANALOG</div><span class="ca">→</span>
  <div class="cb" id="cb-noise">NOISE</div><span class="ca">→</span>
  <div class="cb on" id="cb-adc">NYQUIST ADC</div><span class="ca">→</span>
  <div class="cb" id="cb-filter">FILTER ×1</div><span class="ca">→</span>
  <div class="cb on">DIGITAL</div>
</div>

<canvas id="c" width="1200" height="780"></canvas>

<div id="ctrl">
  <div class="cg">
    <div class="cgt">ADC MODE</div>
    <div class="moderow">
      <button class="modebtn on" id="btn-nyq" onclick="setMode('nyquist')">Nyquist</button>
      <button class="modebtn"   id="btn-sd1" onclick="setMode('sigma_delta')">ΣΔ 1st</button>
      <button class="modebtn"   id="btn-sd2" onclick="setMode('sigma_delta2')">ΣΔ 2nd</button>
    </div>
    <div class="ditrow">
      <input type="checkbox" id="dithcb" onchange="setDither(this.checked)">
      <label for="dithcb">Dither (ΣΔ only)</label>
    </div>
    <button id="playbtn" onclick="togglePause()">⏸ Pause</button>
  </div>

  <div class="cg">
    <div class="cgt">SIGNAL</div>
    <div class="cr">
      <label>Frequency</label>
      <input type="range" id="sl-freq" min="0.1" max="5" step="0.05" value="1.0"
             oninput="setParam('freq',+this.value,'v-freq',v=>v.toFixed(2)+' Hz')">
      <span class="v" id="v-freq">1.00 Hz</span>
    </div>
    <div class="cr">
      <label>Amplitude</label>
      <input type="range" id="sl-amp" min="0.05" max="1.0" step="0.01" value="0.8"
             oninput="setParam('amp',+this.value,'v-amp',v=>v.toFixed(2)+' FS')">
      <span class="v" id="v-amp">0.80 FS</span>
    </div>
    <div class="cr">
      <label>Speed</label>
      <input type="range" id="sl-speed" min="0.1" max="5" step="0.05" value="1.0"
             oninput="setSpeed(+this.value)">
      <span class="v" id="v-speed">1.0×</span>
    </div>
    <div class="cr">
      <label>Noise</label>
      <input type="range" id="sl-noise" min="0" max="0.4" step="0.01" value="0"
             oninput="setParam('noise',+this.value,'v-noise',v=>v.toFixed(2))">
      <span class="v" id="v-noise">0.00</span>
    </div>
  </div>

  <div class="cg">
    <div class="cgt">QUANTISER</div>
    <div class="cr">
      <label>Bits</label>
      <input type="range" id="sl-bits" min="1" max="8" step="1" value="3"
             oninput="setBits(+this.value)">
      <span class="v" id="v-bits">3 b</span>
    </div>
    <div class="cr">
      <label>Sample period</label>
      <input type="range" id="sl-ts" min="0.04" max="1.0" step="0.01" value="0.25"
             oninput="setTs(+this.value)">
      <span class="v" id="v-ts">0.25 s</span>
    </div>
  </div>

  <div class="cg">
    <div class="cgt">FILTER (ΣΔ)</div>
    <div class="cr">
      <label>Filter taps K</label>
      <input type="range" id="sl-taps" min="1" max="64" step="1" value="1"
             oninput="setTaps(+this.value)">
      <span class="v" id="v-taps">1</span>
    </div>
    <div style="color:var(--muted);font-size:10px;line-height:1.7;margin-top:2px;">
      Sinc<sup>M</sup> decimator (M = order+1)<br>
      <span id="filter-info">Nyquist: no filter</span>
    </div>
  </div>
</div>

<div id="legend">
  <div class="leg"><div class="lsw" style="background:#3361e6"></div>Analog signal</div>
  <div class="leg"><div class="ldot" style="background:#ffd400"></div>Sample instants</div>
  <div class="leg"><div class="ldot" style="background:#b6e3b6"></div>Raw ADC output</div>
  <div class="leg"><div class="lsw" style="background:#cdd6e6"></div>Filtered digital</div>
  <div class="leg"><div class="lsw" style="background:#ff4444"></div>Quant. error</div>
  <div class="leg"><div class="lsw" style="background:#39ff14"></div>FFT signal bin</div>
</div>

<script>
'use strict';

// ─── REFERENCE ────────────────────────────────────────────────────────────────
// The Python source in src/cicadc/ is the authoritative reference implementation.
// When verifying or extending ADC / signal / filter behaviour, consult:
//   src/cicadc/sigma_delta.py   – SD1 and SD2 modulator recursions and quantizer
//   src/cicadc/manim_scene.py   – decimation filter, _filter_gain, staircase drawing
//   src/cicadc/quantizer.py     – mid-tread Nyquist quantizer
//   src/cicadc/signal_source.py – sinusoid + value-noise model

// ─── Canvas ───────────────────────────────────────────────────────────────────
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let CW = 1200, CH = 780;

// ─── Layout (canvas pixels) — recomputed by updateLayout() ───────────────────
let LP, RP, NP, FP;
let pxf = 1;   // panel pixel scale factor relative to 580 px reference width
let DPR = 1;   // device pixel ratio

const pcx = p => (p.x0 + p.x1) / 2;
const pcy = p => (p.y0 + p.y1) / 2;
const pw  = p => p.x1 - p.x0;
const ph  = p => p.y1 - p.y0;

// ─── Responsive canvas ────────────────────────────────────────────────────────
function updateLayout() {
  const mobile = CW < 700;
  if (mobile) {
    const x0 = 10, x1 = CW - 10;
    const phMain  = Math.round(CW * 0.58);
    const phStrip = Math.round(CW * 0.30);
    const gap = 16;
    LP = {x0, y0: 38,          x1, y1: 38 + phMain};
    RP = {x0, y0: LP.y1 + gap, x1, y1: LP.y1 + gap + phMain};
    NP = {x0, y0: RP.y1 + gap, x1, y1: RP.y1 + gap + phStrip};
    FP = {x0, y0: NP.y1 + gap, x1, y1: NP.y1 + gap + phStrip};
  } else {
    const sX = Math.round(CW * 590 / 1200);
    const sY = Math.round(CH * 530 / 780);
    const gX = Math.round(CW * 610 / 1200);
    const bY = Math.round(CH * 548 / 780);
    LP = {x0: 10,  y0: 35, x1: sX,    y1: sY};
    RP = {x0: gX,  y0: 35, x1: CW-10, y1: sY};
    NP = {x0: 10,  y0: bY, x1: sX,    y1: CH-10};
    FP = {x0: gX,  y0: bY, x1: CW-10, y1: CH-10};
  }
  pxf = Math.max(0.58, Math.min(pw(LP), pw(RP)) / 580);
}

function resizeCanvas() {
  DPR = window.devicePixelRatio || 1;
  const mobile = window.innerWidth < 700;
  CW = Math.min(1200, window.innerWidth - 20);
  if (mobile) {
    const phMain  = Math.round(CW * 0.58);
    const phStrip = Math.round(CW * 0.30);
    CH = 38 + 2 * phMain + 2 * phStrip + 3 * 16 + 10;
  } else {
    CH = Math.round(CW * 780 / 1200);
  }
  cv.width  = Math.round(CW * DPR);
  cv.height = Math.round(CH * DPR);
  cv.style.width  = CW + 'px';
  cv.style.height = CH + 'px';
  updateLayout();
}

// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  t:      0,
  speed:  1.0,
  freq:   1.0,
  amp:    0.8,
  bits:   3,
  Ts:     0.25,
  noise:  0.0,
  taps:   1,   // Python default is also 1 (no filter); raise to see decimation
  mode:   'nyquist',
  dither: false,
  paused: false,
  vref:   1.0,
  win:    4.0,   // total visible window = ±win/2 around "now"
};

// ─── Signal ───────────────────────────────────────────────────────────────────
function cleanSig(t) {
  return S.amp * Math.sin(2 * Math.PI * S.freq * t);
}
// d(cleanSig)/dt
function cleanSigDeriv(t) {
  return S.amp * 2 * Math.PI * S.freq * Math.cos(2 * Math.PI * S.freq * t);
}
function noiseHash(n) {
  const x = Math.sin(n * 12.9898) * 43758.5453;
  return 2 * (x - Math.floor(x)) - 1;
}
function noiseAt(t) {
  if (!S.noise) return 0;
  const i = t / 0.06, i0 = Math.floor(i), f = i - i0;
  const fs = f * f * (3 - 2 * f);  // smoothstep
  return S.noise * (noiseHash(i0) * (1 - fs) + noiseHash(i0 + 1) * fs);
}
function sigAt(t)  { return cleanSig(t) + noiseAt(t); }
function smpVal(k) { return sigAt(k * S.Ts); }

// ─── Nyquist mid-tread quantiser ──────────────────────────────────────────────
// Levels at centres of 2**bits equal-width bins in [-vref, +vref].
function nyQ(v) {
  const L = 1 << S.bits;
  const step = 2 * S.vref / L;
  const idx = Math.max(0, Math.min(L - 1, Math.floor((v + S.vref) / step)));
  return -S.vref + (idx + 0.5) * step;
}

// ─── Sigma-delta internal quantiser (mid-rise) ────────────────────────────────
// Matches Python's _SigmaDeltaBase._quantize:
//   levels <= 2  → ±vref  (1-bit comparator)
//   otherwise    → 2**bits levels spaced 2*vref/(L-1) apart
function ditherV(k) {
  const x = Math.sin(k * 78.233 + 1.0) * 43758.5453;
  return 2 * (x - Math.floor(x)) - 1;
}
function sdQ(v, k) {
  const L = 1 << S.bits;
  const u = v + (S.dither ? 0.5 * ditherV(k) : 0);
  if (L <= 2) return u >= 0 ? S.vref : -S.vref;
  const step = 2 * S.vref / (L - 1);
  const idx  = Math.max(0, Math.min(L - 1, Math.round((u + S.vref) / step)));
  return -S.vref + idx * step;
}

// ─── Sigma-delta caches ───────────────────────────────────────────────────────
let c1 = new Map(), c2 = new Map(), cKey = '';

function sdCacheKey() {
  return `${S.bits}|${S.dither}|${S.freq}|${S.amp}|${S.Ts}|${S.noise}`;
}
function checkCache() {
  const k = sdCacheKey();
  if (k !== cKey) { c1.clear(); c2.clear(); cKey = k; resetFFTBuf(); }
}

// 1st-order: x[n] = x[n-1] + (u[n] − y[n-1]),  y[n] = Q(x[n])
function sd1(k) {
  checkCache();
  const hit = c1.get(k);
  if (hit) return hit[1];
  const prev = c1.get(k - 1);
  if (prev) {
    const x = prev[0] + (smpVal(k) - prev[1]);
    const y = sdQ(x, k);
    c1.set(k, [x, y]);
    return y;
  }
  // Cold start: run 128 warm-up steps before k
  let s = [0, 0];
  for (let n = k - 128; n <= k; n++) {
    const x = s[0] + (smpVal(n) - s[1]);
    const y = sdQ(x, n);
    s = [x, y];
    c1.set(n, s);
  }
  return s[1];
}

// 2nd-order CIFB (a1=1, a2=2, b1=1, g1=1 → NTF = (1−z⁻¹)²):
//   x1[n] = x1[n-1] + (u[n] − y[n-1])
//   x2[n] = x2[n-1] + (x1[n] − 2·y[n-1])
//   y[n]  = Q(x2[n])
function sd2(k) {
  checkCache();
  const hit = c2.get(k);
  if (hit) return hit[2];
  const prev = c2.get(k - 1);
  if (prev) {
    const u  = smpVal(k);
    const x1 = prev[0] + (u  - prev[2]);
    const x2 = prev[1] + (x1 - 2 * prev[2]);
    const y  = sdQ(x2, k);
    c2.set(k, [x1, x2, y]);
    return y;
  }
  let s = [0, 0, 0];
  for (let n = k - 128; n <= k; n++) {
    const u  = smpVal(n);
    const x1 = s[0] + (u  - s[2]);
    const x2 = s[1] + (x1 - 2 * s[2]);
    const y  = sdQ(x2, n);
    s = [x1, x2, y];
    c2.set(n, s);
  }
  return s[2];
}

function rawOut(k) {
  if (S.mode === 'sigma_delta')  return sd1(k);
  if (S.mode === 'sigma_delta2') return sd2(k);
  return nyQ(smpVal(k));
}

// ─── Sinc^M decimation filter ─────────────────────────────────────────────────
// Composite FIR h = [1]*K convolved M times.  sum(h) = K^M (the DC gain).
// Matches Python's _decimation_taps() and _filt_level().
let firH = null, firKey = '';
let stfCache = null, stfPhase = 0, stfKey = '';

function getFIR() {
  const K = Math.max(1, S.taps);
  const M = S.mode === 'nyquist' ? 1 : S.mode === 'sigma_delta' ? 2 : 3;
  const key = `${K}|${M}`;
  if (key === firKey && firH) return firH;
  let h = [1];
  for (let m = 0; m < M; m++) {
    const res = new Array(h.length + K - 1).fill(0);
    for (let i = 0; i < h.length; i++)
      for (let j = 0; j < K; j++)
        res[i + j] += h[i];  // h[i] * box[j] where box[j]=1
    h = res;
  }
  firH = h; firKey = key;
  return h;
}

// Hann-windowed DFT lock-in of the modulator output vs the clean reference sine
// at the signal frequency.  Returns |STF(e^jw)| — the in-band gain of the SD
// loop itself (not the decimation filter).  For SD1 this is ≈1; for SD2 it dips
// below 1 and must be divided out so the reconstructed amplitude is correct.
// Cached by modulator parameters; cleared by invalidateSD().
// Matches Python's _modulator_stf() in src/cicadc/manim_scene.py.
function modSTFmag() {
  if (S.mode === 'nyquist' || S.taps <= 1) return 1.0;
  const w = 2 * Math.PI * S.freq * S.Ts;
  if (Math.abs(w) < 1e-6) return 1.0;

  const key = `${S.mode}|${S.bits}|${S.dither}|${S.freq.toFixed(6)}|${S.amp.toFixed(6)}|${S.Ts.toFixed(6)}`;
  if (key === stfKey && stfCache !== null) return stfCache;

  const sampPerCycle = 1.0 / Math.max(S.freq * S.Ts, 1e-9);
  const n  = Math.min(Math.max(Math.round(sampPerCycle * 24), 64), 4000);
  const k0 = Math.floor(S.t / S.Ts);

  let numRe = 0, numIm = 0, denRe = 0, denIm = 0;
  for (let i = 0; i < n; i++) {
    const k   = k0 - n + 1 + i;
    const t   = k * S.Ts;
    const wt  = 2 * Math.PI * S.freq * t;
    const hw  = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));  // Hann
    const cw  = Math.cos(-wt);   // Re(exp(-j*w*t))
    const sw2 = Math.sin(-wt);   // Im(exp(-j*w*t))
    const y   = rawOut(k);
    const r   = cleanSig(t);
    numRe += y * hw * cw;  numIm += y * hw * sw2;
    denRe += r * hw * cw;  denIm += r * hw * sw2;
  }

  const denMag = Math.sqrt(denRe*denRe + denIm*denIm);
  const numMag = Math.sqrt(numRe*numRe + numIm*numIm);
  const stf = denMag > 1e-12 ? numMag / denMag : 1.0;
  // angle(num/den) = atan2( Im(num·conj(den)), Re(num·conj(den)) )
  stfPhase = Math.atan2(numIm*denRe - numRe*denIm, numRe*denRe + numIm*denIm);
  stfCache = Math.max(stf, 0.1);
  stfKey   = key;
  return stfCache;
}

// Group delay of the full decimation path in seconds.
// = sinc^M filter linear-phase delay  +  modulator STF phase delay.
// Matches Python's _group_delay() in src/cicadc/manim_scene.py.
function groupDelay() {
  const K = Math.max(1, S.taps);
  if (K <= 1) return 0;
  const M = S.mode === 'nyquist' ? 1 : S.mode === 'sigma_delta' ? 2 : 3;
  let D = M * (K - 1) / 2.0 * S.Ts;
  if (S.mode !== 'nyquist') {
    modSTFmag();  // ensure stfPhase is populated
    const w = 2 * Math.PI * S.freq * S.Ts;
    if (Math.abs(w) > 1e-9) D += (-stfPhase / w) * S.Ts;
  }
  return D;
}

// Magnitude of the full signal path at the signal frequency: sinc^M × |STF|.
// Dividing filtOut by this makes the in-band transfer unity so the staircase
// amplitude matches the analog signal.
// Matches Python's _filter_gain() in src/cicadc/manim_scene.py.
function filtGain() {
  const K = S.taps;
  if (K <= 1) return 1.0;
  const M  = S.mode === 'nyquist' ? 1 : S.mode === 'sigma_delta' ? 2 : 3;
  const w  = 2 * Math.PI * S.freq * S.Ts;
  const sw = Math.sin(w / 2);
  if (Math.abs(sw) < 1e-9) return 1.0;
  const sincM = Math.pow(Math.abs(Math.sin(K * w / 2) / (K * sw)), M);
  return Math.max(sincM * modSTFmag(), 0.05);
}

function filtOut(k) {
  if (S.taps <= 1) return rawOut(k);
  const h    = getFIR();
  const hSum = h.reduce((a, b) => a + b, 0);  // = K^M (DC gain)
  let acc = 0;
  for (let j = 0; j < h.length; j++) acc += h[j] * rawOut(k - j);
  // Divide by hSum (DC normalisation) then by filtGain (frequency-domain correction
  // so the in-band amplitude of the staircase matches the analog signal).
  // Reference: src/cicadc/manim_scene.py  _filt_level()
  return (acc / hSum) / filtGain();
}

// ─── FFT (Cooley-Tukey radix-2, in-place) ────────────────────────────────────
const FFT_N = 512;
const fftBuf = new Float32Array(FFT_N);
let fftHead = 0, fftLastK = -1, fftMag = null;

function resetFFTBuf() {
  fftBuf.fill(0); fftHead = 0; fftLastK = -1; fftMag = null;
}

function updateFFT(kNow) {
  if (kNow === fftLastK) return;
  const from = fftLastK < 0 ? kNow - FFT_N + 1 : fftLastK + 1;
  for (let k = from; k <= kNow; k++) {
    fftBuf[fftHead % FFT_N] = filtOut(k);
    fftHead++;
  }
  fftLastK = kNow;

  // Hann-windowed input from oldest (index fftHead % FFT_N) to newest
  const re = new Array(FFT_N), im = new Array(FFT_N).fill(0);
  for (let n = 0; n < FFT_N; n++) {
    const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / (FFT_N - 1));
    re[n] = fftBuf[(fftHead + n) % FFT_N] * w;
  }

  // Bit-reversal permutation
  let j = 0;
  for (let i = 1; i < FFT_N; i++) {
    let bit = FFT_N >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }
  // Butterfly stages
  for (let len = 2; len <= FFT_N; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < FFT_N; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < (len >> 1); k++) {
        const ur = re[i+k], ui = im[i+k];
        const vr = re[i+k+(len>>1)]*cr - im[i+k+(len>>1)]*ci;
        const vi = re[i+k+(len>>1)]*ci + im[i+k+(len>>1)]*cr;
        re[i+k]         = ur+vr; im[i+k]         = ui+vi;
        re[i+k+(len>>1)] = ur-vr; im[i+k+(len>>1)] = ui-vi;
        const ncr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = ncr;
      }
    }
  }

  // Magnitude in dBFS.
  // Hann coherent gain = 0.5, so a full-scale sinusoid (A=1) produces
  // FFT bin magnitude = A * FFT_N/2 * 0.5 = FFT_N/4.
  // Dividing by FFT_N/4 normalises 0 dBFS to a full-scale sine.
  const norm = FFT_N / 4;
  const half = FFT_N >> 1;
  fftMag = new Float32Array(half);
  for (let i = 0; i < half; i++) {
    const m = Math.sqrt(re[i]*re[i] + im[i]*im[i]) / norm;
    fftMag[i] = Math.max(-80, 20 * Math.log10(m + 1e-12));
  }
}

// ─── Coordinate helpers ───────────────────────────────────────────────────────
// tRel=0 → panel centre ("now"); tRel>0 → up (future); tRel<0 → down (past).
function tY(p, tRel) { return pcy(p) - tRel * ph(p) / S.win; }
// value ±vref maps to ±40% of the panel half-width from centre.
function vX(p, v)    { return pcx(p) + v * pw(p) * 0.4 / S.vref; }

// Tangent angle (canvas radians) of the clean-signal curve on LP at t_rel.
// Car image is rear-view, nose points toward top of image = upward on canvas.
// The formula gives −π/2 for a flat signal (straight up), tilting as needed.
function curveAngle(tRel) {
  const dydt = -ph(LP) / S.win;                              // canvas dy per second
  const dxdt = (pw(LP) * 0.4 / S.vref) * cleanSigDeriv(S.t + tRel);
  return Math.atan2(dydt, dxdt) + Math.PI / 2;
}

// ─── Car image loading ────────────────────────────────────────────────────────
const CAR_SIZE = 48;
const carSprites = {};   // keyed by variant: 'blue' | 'green' | 'gray'
let carReady = false;

(function loadCar() {
  const img = new Image();
  img.onload = () => {
    try {
      // Scale down immediately so getImageData works on a tiny buffer (CAR_SIZE²×4 bytes).
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = CAR_SIZE;
      const tc = tmp.getContext('2d', { willReadFrequently: true });
      tc.drawImage(img, 0, 0, CAR_SIZE, CAR_SIZE);

      // Green-chroma removal: g>110 && g−r>40 && g−b>40
      const raw = tc.getImageData(0, 0, CAR_SIZE, CAR_SIZE);
      const px  = raw.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        if (g > 110 && g - r > 40 && g - b > 40) px[i+3] = 0;
      }
      // px is now the chroma-keyed source; keep it as the master copy.

      // Build tinted variants: each uses a fresh copy of the keyed pixels.
      const variants = {
        blue:  [0.45, 0.65, 2.00],   // boost: lum*2 on B channel → vibrant blue
        green: [0.35, 2.00, 0.35],   // boost: lum*2 on G channel → vibrant green
        gray:  [1.30, 1.40, 1.60],   // boost: all channels → bright cool gray
      };
      for (const [name, [tr, tg, tb]] of Object.entries(variants)) {
        const copy = new Uint8ClampedArray(px);   // fresh copy each time
        for (let i = 0; i < copy.length; i += 4) {
          if (copy[i+3] > 0) {
            const lum = 0.299*copy[i] + 0.587*copy[i+1] + 0.114*copy[i+2];
            copy[i]   = lum * tr | 0;
            copy[i+1] = lum * tg | 0;
            copy[i+2] = lum * tb | 0;
          }
        }
        const out = document.createElement('canvas');
        out.width = out.height = CAR_SIZE;
        out.getContext('2d').putImageData(new ImageData(copy, CAR_SIZE, CAR_SIZE), 0, 0);
        carSprites[name] = out;
      }
      carReady = true;
    } catch (e) { console.warn('Car load failed:', e.message); }
  };
  img.onerror = () => console.warn('car.png not found');
  img.src = 'car.png';
})();

// Draw the car sprite (or triangle fallback) centred at (x,y), rotated by angle.
// angle=0 → default image orientation (nose pointing up = toward future).
function drawCar(x, y, angle, variant, alpha) {
  cx.save();
  cx.globalAlpha = alpha == null ? 1 : alpha;
  cx.translate(x, y);
  cx.rotate(angle);
  const drawSize = Math.max(16, CAR_SIZE * pxf);
  if (carReady && carSprites[variant]) {
    const s = drawSize / 2;
    cx.drawImage(carSprites[variant], -s, -s, drawSize, drawSize);
  } else {
    // Triangle: vertex at top → points up at angle=0
    const col = {blue:'#3361e6', green:'#b6e3b6', gray:'#cdd6e6'}[variant] || '#cdd6e6';
    cx.fillStyle = col;
    const h = drawSize * 0.5, w = drawSize * 0.38;
    cx.beginPath();
    cx.moveTo(0, -h); cx.lineTo(-w, h * 0.6); cx.lineTo(w, h * 0.6); cx.closePath();
    cx.fill();
  }
  cx.restore();
}

// ─── Panel drawing helpers ────────────────────────────────────────────────────
function clip(p) {
  cx.beginPath(); cx.rect(p.x0, p.y0, pw(p), ph(p)); cx.clip();
}

function panelBg(p) {
  cx.fillStyle = '#0b0f1a';
  cx.fillRect(p.x0, p.y0, pw(p), ph(p));
  cx.strokeStyle = '#2b3a63'; cx.lineWidth = 1;
  cx.strokeRect(p.x0+.5, p.y0+.5, pw(p)-1, ph(p)-1);
}

function panelGrid(p) {
  // Quantisation threshold lines (L+1 vertical lines at bin boundaries)
  const L = 1 << S.bits, step = 2 * S.vref / L;
  cx.strokeStyle = '#1d2742'; cx.lineWidth = Math.max(0.3, 0.5 * pxf);
  for (let i = 0; i <= L; i++) {
    const x = vX(p, -S.vref + i * step);
    cx.beginPath(); cx.moveTo(x, p.y0); cx.lineTo(x, p.y1); cx.stroke();
  }
  // Zero-amplitude axis
  cx.strokeStyle = '#3b5090'; cx.lineWidth = Math.max(0.5, pxf);
  cx.beginPath(); cx.moveTo(vX(p,0), p.y0); cx.lineTo(vX(p,0), p.y1); cx.stroke();
  // Horizontal time-grid lines (every second)
  cx.strokeStyle = '#1d2742'; cx.lineWidth = Math.max(0.3, 0.5 * pxf);
  for (let t = -Math.ceil(S.win/2); t <= Math.ceil(S.win/2); t++) {
    const y = tY(p, t);
    cx.beginPath(); cx.moveTo(p.x0, y); cx.lineTo(p.x1, y); cx.stroke();
  }
  // "Now" dashed line
  cx.strokeStyle = '#ffd400'; cx.lineWidth = Math.max(0.5, pxf); cx.setLineDash([5*pxf,5*pxf]);
  cx.beginPath(); cx.moveTo(p.x0+2, tY(p,0)); cx.lineTo(p.x1-2, tY(p,0)); cx.stroke();
  cx.setLineDash([]);
}

function panelLabels(p, title, titleColor) {
  const fMain = Math.max(7, Math.round(11 * pxf));
  const fSub  = Math.max(6, Math.round(9  * pxf));
  cx.fillStyle = titleColor;
  cx.font = `bold ${fMain}px monospace`;
  cx.textAlign = 'center';
  cx.fillText(title, pcx(p), p.y0 - Math.round(7 * pxf));
  cx.fillStyle = '#506070';
  cx.font = `${fSub}px monospace`;
  cx.textAlign = 'left';
  cx.fillText('↑ future', p.x0 + Math.round(5*pxf), p.y0 + Math.round(12*pxf));
  cx.fillText('↓ past',   p.x0 + Math.round(5*pxf), p.y1 - Math.round(4*pxf));
  cx.fillText('now',      p.x0 + Math.round(5*pxf), tY(p,0) - Math.round(3*pxf));
  // FS axis labels below panel — only when there's enough room
  if (pxf > 0.75) {
    cx.textAlign = 'center';
    cx.fillText('+FS', vX(p, S.vref),  p.y1 + Math.round(11*pxf));
    cx.fillText('0',   vX(p, 0),       p.y1 + Math.round(11*pxf));
    cx.fillText('−FS', vX(p, -S.vref), p.y1 + Math.round(11*pxf));
  }
}

// ─── Analog panel ─────────────────────────────────────────────────────────────
function drawAnalog() {
  panelBg(LP);
  panelLabels(LP, 'ANALOG SIGNAL', '#3361e6');
  cx.save(); clip(LP);
  panelGrid(LP);

  const half = S.win / 2;

  // Smooth analog curve
  cx.strokeStyle = '#3361e6'; cx.lineWidth = Math.max(1, 2.5 * pxf);
  cx.beginPath();
  for (let i = 0, N = 400; i <= N; i++) {
    const tr = -half + i * S.win / N;
    i === 0
      ? cx.moveTo(vX(LP, cleanSig(S.t+tr)), tY(LP, tr))
      : cx.lineTo(vX(LP, cleanSig(S.t+tr)), tY(LP, tr));
  }
  cx.stroke();

  // Sample dots and raw-ADC shadows
  const k0 = Math.ceil( (S.t - half) / S.Ts);
  const k1 = Math.floor((S.t + half) / S.Ts);
  for (let k = k0; k <= k1; k++) {
    const tr = k * S.Ts - S.t;
    const y  = tY(LP, tr);
    cx.fillStyle = '#ffd400';
    cx.beginPath(); cx.arc(vX(LP, cleanSig(k*S.Ts)), y, Math.max(1.5, 3.5*pxf), 0, 2*Math.PI); cx.fill();
    cx.fillStyle = 'rgba(182,227,182,0.55)';
    cx.beginPath(); cx.arc(vX(LP, rawOut(k)), y, Math.max(1.5, 3*pxf), 0, 2*Math.PI); cx.fill();
  }

  const kNow = Math.floor(S.t / S.Ts);
  const yNow = tY(LP, 0);
  const ang  = curveAngle(0);

  // Ghost car (pale-green, 60% opacity): raw ADC level at "now"
  drawCar(vX(LP, rawOut(kNow)), yNow, ang, 'green', 0.60);
  // Gray car: decimated filter output, shown at the group-delay offset in the past
  if (S.taps > 1) {
    const D       = groupDelay();
    const dVis    = Math.min(D, 0.82 * S.win / 2);  // clamp to visible window
    const K       = S.taps;
    const kDec    = Math.floor(kNow / K) * K;
    drawCar(vX(LP, filtOut(kDec)), tY(LP, -dVis), curveAngle(-dVis), 'gray', 1.0);
  }
  // Blue car: clean analog value at "now"
  drawCar(vX(LP, cleanSig(S.t)), yNow, ang, 'blue', 1.0);

  cx.restore();
}

// ─── Digital panel ────────────────────────────────────────────────────────────
function drawDigital() {
  const label = {nyquist:'NYQUIST', sigma_delta:'ΣΔ 1ST ORDER', sigma_delta2:'ΣΔ 2ND ORDER'}[S.mode];
  panelBg(RP);
  panelLabels(RP, `DIGITAL OUTPUT — ${label}`, '#cdd6e6');
  cx.save(); clip(RP);
  panelGrid(RP);

  const half = S.win / 2;
  const k0 = Math.floor((S.t - half) / S.Ts) - 1;
  const k1 = Math.ceil( (S.t + half) / S.Ts) + 1;

  // Raw SD dots (only in sigma-delta modes)
  if (S.mode !== 'nyquist') {
    for (let k = k0; k <= k1; k++) {
      cx.fillStyle = 'rgba(182,227,182,0.4)';
      cx.beginPath();
      cx.arc(vX(RP, rawOut(k)), tY(RP, k*S.Ts - S.t), Math.max(1, 2.5*pxf), 0, 2*Math.PI);
      cx.fill();
    }
  }

  // Staircase: for SD modes draw at the decimated rate (one step per K samples)
  // so the post-filter output is visually distinct from the oversampled raw output.
  // For Nyquist (no filter) each sample is one step as usual.
  const K = S.taps > 1 ? S.taps : 1;
  cx.strokeStyle = '#cdd6e6'; cx.lineWidth = Math.max(1, 2 * pxf);
  cx.beginPath();
  let started = false;
  const kd0 = Math.floor(k0 / K);
  const kd1 = Math.ceil(k1  / K);
  for (let kd = kd0; kd <= kd1; kd++) {
    const k  = kd * K;
    const x  = vX(RP, filtOut(k));
    const yS = tY(RP, k       * S.Ts - S.t);
    const yE = tY(RP, (k + K) * S.Ts - S.t);
    if (!started) { cx.moveTo(x, yS); started = true; }
    else          cx.lineTo(x, yS);  // horizontal: step to new decimated value
    cx.lineTo(x, yE);                // vertical:   hold for K·Ts
  }
  cx.stroke();

  // Gray car at "now": sit on the current decimated staircase level
  const kNow    = Math.floor(S.t / S.Ts);
  const kDecNow = Math.floor(kNow / K) * K;
  drawCar(vX(RP, filtOut(kDecNow)), tY(RP, 0), 0, 'gray', 1.0);

  cx.restore();
}

// ─── Quantisation noise strip ─────────────────────────────────────────────────
function drawNoise() {
  const p = NP;
  panelBg(p);
  const fNoise = Math.max(7, Math.round(10 * pxf));
  cx.fillStyle = '#6090b0'; cx.font = `bold ${fNoise}px monospace`; cx.textAlign = 'center';
  const noiseTitle = pxf > 0.75
    ? 'QUANTISATION ERROR — filtered output vs analog input'
    : 'QUANT ERROR (post-filter)';
  cx.fillText(noiseTitle, pcx(p), p.y0 - Math.round(5*pxf));
  cx.save(); clip(p);

  const kNow  = Math.floor(S.t / S.Ts);
  const tSpan = S.win;
  const k0    = Math.ceil((S.t - tSpan) / S.Ts);
  const yCen  = pcy(p);
  const lsb   = 2 * S.vref / (1 << S.bits);
  const yScl  = ph(p) * 0.42;  // maps ±1 FS to ±42 % of strip height

  // Zero line
  cx.strokeStyle = '#3b5090'; cx.lineWidth = Math.max(0.5, pxf);
  cx.beginPath(); cx.moveTo(p.x0, yCen); cx.lineTo(p.x1, yCen); cx.stroke();

  // ±½ LSB and ±1 LSB reference dashes
  cx.strokeStyle = '#1d2742'; cx.lineWidth = Math.max(0.3, 0.5*pxf); cx.setLineDash([4*pxf,4*pxf]);
  for (const f of [0.5, 1, -0.5, -1]) {
    const y = yCen - f * lsb * yScl;
    cx.beginPath(); cx.moveTo(p.x0, y); cx.lineTo(p.x1, y); cx.stroke();
  }
  cx.setLineDash([]);

  // Map sample index k to x position (now = right edge)
  const xOf = k => p.x0 + (k * S.Ts - (S.t - tSpan)) / tSpan * pw(p);

  // Error staircase: filtered output vs time-aligned analog input.
  // Steps at the decimated rate (K) to match the digital staircase.
  // sigAt(k·Ts − D) aligns the analog reference to the filter's output time.
  const D  = groupDelay();
  const K  = S.taps > 1 ? S.taps : 1;
  const kd0 = Math.ceil(k0 / K);
  const kd1 = Math.floor(kNow / K);
  cx.strokeStyle = '#ff4444'; cx.lineWidth = Math.max(0.8, 1.5*pxf);
  cx.beginPath();
  let started = false;
  for (let kd = kd0; kd <= kd1; kd++) {
    const k   = kd * K;
    const err = sigAt(k * S.Ts - D) - filtOut(k);
    const xS  = xOf(k), xE = xOf(k + K);
    const y   = yCen - err * yScl;
    if (!started) { cx.moveTo(Math.max(p.x0, xS), y); started = true; }
    else          cx.lineTo(Math.max(p.x0, xS), y);
    cx.lineTo(Math.min(p.x1, xE), y);
  }
  cx.stroke();

  // "Now" marker (right edge)
  cx.strokeStyle = '#ffd400'; cx.lineWidth = Math.max(0.5, pxf); cx.setLineDash([4*pxf,3*pxf]);
  cx.beginPath(); cx.moveTo(p.x1, p.y0); cx.lineTo(p.x1, p.y1); cx.stroke();
  cx.setLineDash([]);

  cx.fillStyle = '#506070'; cx.font = `${Math.max(6, Math.round(9*pxf))}px monospace`; cx.textAlign = 'left';
  cx.fillText('+1 LSB', p.x0 + Math.round(3*pxf), yCen - lsb*yScl - Math.round(2*pxf));
  cx.fillText('−1 LSB', p.x0 + Math.round(3*pxf), yCen + lsb*yScl + Math.round(9*pxf));
  cx.restore();
}

// ─── FFT strip ────────────────────────────────────────────────────────────────
function drawFFT() {
  const p = FP;
  panelBg(p);
  const fFFT = Math.max(7, Math.round(10 * pxf));
  cx.fillStyle = '#6090b0'; cx.font = `bold ${fFFT}px monospace`; cx.textAlign = 'center';
  const fftTitle = pxf > 0.75 ? 'FFT SPECTRUM  (Hann 512-pt, dBFS, log-freq axis)' : 'FFT (Hann 512, dBFS)';
  cx.fillText(fftTitle, pcx(p), p.y0 - Math.round(5*pxf));
  cx.save(); clip(p);

  if (!fftMag) { cx.restore(); return; }

  const fs    = 1 / S.Ts;
  const fNyq  = fs / 2;
  const fMin  = fs / FFT_N * 0.8;
  const lgMin = Math.log10(Math.max(fMin, 1e-4));
  const lgMax = Math.log10(fNyq);
  const lgR   = lgMax - lgMin;
  const floor = -80;

  // dB grid lines
  cx.strokeStyle = '#1d2742'; cx.lineWidth = Math.max(0.3, 0.5*pxf);
  for (const db of [-20, -40, -60, -80]) {
    const y = p.y1 - (db - floor) / -floor * ph(p);
    cx.beginPath(); cx.moveTo(p.x0, y); cx.lineTo(p.x1, y); cx.stroke();
    cx.fillStyle = '#506070'; cx.font = `${Math.max(6, Math.round(9*pxf))}px monospace`; cx.textAlign = 'left';
    cx.fillText(`${db} dB`, p.x0 + Math.round(3*pxf), y - Math.round(2*pxf));
  }

  // Frequency tick marks
  cx.fillStyle = '#506070'; cx.font = `${Math.max(6, Math.round(9*pxf))}px monospace`; cx.textAlign = 'center';
  for (const f of [0.05,0.1,0.2,0.5,1,2,5,10,20,50,100]) {
    if (f < fMin || f > fNyq) continue;
    const x = p.x0 + (Math.log10(f) - lgMin) / lgR * pw(p);
    cx.strokeStyle = '#1d2742'; cx.lineWidth = Math.max(0.3, 0.5*pxf);
    cx.beginPath(); cx.moveTo(x, p.y0); cx.lineTo(x, p.y1); cx.stroke();
    cx.fillText(`${f}`, x, p.y1 + Math.round(11*pxf));
  }
  cx.fillText('Hz', p.x1 - Math.round(2*pxf), p.y1 + Math.round(11*pxf));

  // Bars
  for (let i = 1; i < FFT_N >> 1; i++) {
    const f = i * fs / FFT_N;
    if (f <= fMin || f > fNyq) continue;
    const xFrac  = (Math.log10(f)             - lgMin) / lgR;
    const xFnext = (Math.log10(f + fs/FFT_N)  - lgMin) / lgR;
    if (xFrac < 0 || xFrac > 1) continue;
    const x1 = p.x0 + xFrac  * pw(p);
    const x2 = p.x0 + Math.min(1, xFnext) * pw(p);
    const bw = Math.max(1, x2 - x1);
    const yFrac = Math.max(0, (fftMag[i] - floor) / -floor);
    const isInput = Math.abs(f - S.freq) < fs / FFT_N * 2;
    cx.fillStyle = isInput ? '#39ff14' : '#3b82f6';
    cx.fillRect(x1, p.y1 - yFrac * ph(p), bw, yFrac * ph(p));
  }
  cx.restore();
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.clearRect(0, 0, CW, CH);
  updateFFT(Math.floor(S.t / S.Ts));
  drawAnalog();
  drawDigital();
  drawNoise();
  drawFFT();
}

// ─── Animation loop ───────────────────────────────────────────────────────────
let lastTS = null;
function loop(ts) {
  if (!S.paused) {
    if (lastTS !== null) S.t += Math.min((ts - lastTS) / 1000, 0.1) * S.speed;
    lastTS = ts;
  } else {
    lastTS = null;
  }
  render();
  requestAnimationFrame(loop);
}
resizeCanvas();
requestAnimationFrame(loop);
window.addEventListener('resize', resizeCanvas);

// ─── Control handlers ─────────────────────────────────────────────────────────
function invalidateSD() {
  c1.clear(); c2.clear(); cKey = '';
  firH = null; firKey = '';
  stfCache = null; stfPhase = 0; stfKey = '';
  resetFFTBuf();
}

function setParam(key, val, labelId, fmt) {
  S[key] = val;
  document.getElementById(labelId).textContent = fmt(val);
  invalidateSD();
}
function setSpeed(v) {
  S.speed = v;
  document.getElementById('v-speed').textContent = v.toFixed(1) + '×';
}
function setBits(v) {
  S.bits = v;
  document.getElementById('v-bits').textContent = v + ' b';
  invalidateSD();
}
function setTs(v) {
  S.Ts = v;
  document.getElementById('v-ts').textContent = v.toFixed(2) + ' s';
  invalidateSD();
}
function setTaps(v) {
  S.taps = v;
  document.getElementById('v-taps').textContent = v;
  firH = null; firKey = '';
  resetFFTBuf();
  updateFilterInfo();
}
function setDither(on) {
  S.dither = on;
  invalidateSD();
}
function setMode(m) {
  S.mode = m;
  ['nyq','sd1','sd2'].forEach(id => document.getElementById('btn-'+id).classList.remove('on'));
  document.getElementById('btn-'+{nyquist:'nyq',sigma_delta:'sd1',sigma_delta2:'sd2'}[m]).classList.add('on');
  document.getElementById('cb-adc').textContent =
    {nyquist:'NYQUIST ADC', sigma_delta:'ΣΔ 1ST ORDER', sigma_delta2:'ΣΔ 2ND ORDER'}[m];
  invalidateSD();
  updateFilterInfo();
}
function togglePause() {
  S.paused = !S.paused;
  const btn = document.getElementById('playbtn');
  btn.textContent = S.paused ? '▶ Play' : '⏸ Pause';
  btn.classList.toggle('paused', S.paused);
}
function updateFilterInfo() {
  const K = S.taps;
  const M = S.mode === 'nyquist' ? 1 : S.mode === 'sigma_delta' ? 2 : 3;
  document.getElementById('filter-info').textContent =
    S.mode === 'nyquist' ? 'no filter active'
                         : `sinc${M}, K=${K}, FIR len=${M*(K-1)+1}`;
  document.getElementById('cb-filter').classList.toggle('on', S.mode !== 'nyquist' && K > 1);
  document.getElementById('cb-filter').textContent = `FILTER ×${K}`;
}
document.getElementById('sl-noise').addEventListener('input', function() {
  document.getElementById('cb-noise').classList.toggle('on', +this.value > 0);
});
</script>
</body>
</html>
