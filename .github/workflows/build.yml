name: Build binaries

# Standalone, double-click bundles so people can try cicadc without a Python
# install. Runs on demand and on release tags (where the zips are attached to
# the GitHub Release created by release.yml).
on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux build/runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libcairo2-dev libpango1.0-dev libgl1 libegl1

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build bundle
        run: pyinstaller --noconfirm --clean packaging/cicadc.spec

      - name: Package archive
        id: package
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            macOS)
              # Ship a drag-to-Applications .dmg. The app is unsigned, so users
              # still clear quarantine once (see README); the image just makes
              # install familiar by placing the app next to an /Applications link.
              staging="dmg-staging"
              rm -rf "$staging"
              mkdir "$staging"
              cp -R cicadc.app "$staging/"
              ln -s /Applications "$staging/Applications"
              asset="cicadc-${{ matrix.label }}.dmg"
              hdiutil create -volname "cicadc" -srcfolder "$staging" \
                -fs HFS+ -format UDZO -ov "../$asset"
              ;;
            Windows)
              asset="cicadc-${{ matrix.label }}.zip"
              7z a "../$asset" cicadc >/dev/null
              ;;
            *)
              asset="cicadc-${{ matrix.label }}.zip"
              zip -r "../$asset" cicadc >/dev/null
              ;;
          esac
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicadc-${{ matrix.label }}
          path: ${{ steps.package.outputs.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
